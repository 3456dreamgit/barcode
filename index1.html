<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>창고 바코드 스캐너</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0e14;
    --surface: #111720;
    --surface2: #1a2230;
    --border: #1e2d40;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ff4444;
    --text: #e0eeff;
    --muted: #4a6080;
    --scan-line: rgba(0, 212, 255, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .count-badge {
    background: var(--accent);
    color: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
  }

  /* Main layout */
  .container { padding: 16px; max-width: 480px; margin: 0 auto; }

  /* Scanner section */
  .scanner-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .scanner-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .scanner-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s;
  }
  .status-dot.active { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: pulse 1.5s infinite; }
  .status-dot.scanning { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 0.8s infinite; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #camera-view {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    overflow: hidden;
    display: none;
  }

  #camera-view.visible { display: block; }

  #camera-view video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #camera-view canvas { display: none !important; }

  /* Scan overlay */
  .scan-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .scan-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 75%;
    height: 40%;
    border: none;
  }

  .scan-frame::before, .scan-frame::after,
  .scan-frame .corner-bl, .scan-frame .corner-br {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    border-color: var(--accent);
    border-style: solid;
  }
  .scan-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; }
  .scan-frame::after { top: 0; right: 0; border-width: 3px 3px 0 0; }
  .scan-frame .corner-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
  .scan-frame .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; }

  .scan-line-anim {
    position: absolute;
    left: 5%; right: 5%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    top: 0;
    animation: scanMove 2s ease-in-out infinite;
    box-shadow: 0 0 8px var(--accent);
  }

  @keyframes scanMove {
    0% { top: 10%; opacity: 1; }
    50% { top: 90%; opacity: 0.8; }
    100% { top: 10%; opacity: 1; }
  }

  .dim-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.35);
  }

  /* Placeholder */
  .camera-placeholder {
    padding: 40px 20px;
    text-align: center;
  }

  .cam-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.3;
  }

  .cam-hint {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* Buttons */
  .btn-scan {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: calc(100% - 32px);
    margin: 16px;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border: none;
    border-radius: 12px;
    color: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .btn-scan:active { transform: scale(0.97); opacity: 0.85; }

  .btn-scan.stop {
    background: linear-gradient(135deg, var(--warn), #cc2200);
  }

  /* Manual input */
  .manual-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  .barcode-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .barcode-input:focus { border-color: var(--accent); }
  .barcode-input::placeholder { color: var(--muted); }

  .btn-add {
    background: var(--accent2);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    font-weight: 700;
    font-size: 20px;
    width: 46px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-add:active { transform: scale(0.92); }

  /* Toast */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--accent2);
    color: var(--bg);
    font-weight: 700;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 24px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.duplicate { background: var(--warn); }

  /* List section */
  .list-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .list-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .list-actions {
    display: flex;
    gap: 8px;
  }

  .btn-small {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-small:hover { border-color: var(--accent); color: var(--accent); }
  .btn-small.danger:hover { border-color: var(--warn); color: var(--warn); }
  .btn-small:active { transform: scale(0.95); }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 2;
  }

  .empty-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.3; }

  /* List items */
  .barcode-list { padding: 8px; }

  .barcode-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 6px;
    animation: slideIn 0.25s ease;
    transition: border-color 0.2s;
  }

  .barcode-item.new-item { border-color: var(--accent2); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .item-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 24px;
    text-align: center;
  }

  .item-barcode {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text);
    word-break: break-all;
  }

  .item-time {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .btn-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    transition: all 0.2s;
    line-height: 1;
  }
  .btn-delete:hover { color: var(--warn); background: rgba(255,68,68,0.1); }

  /* Export section */
  .export-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
  }

  .export-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn-export {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-export:active { transform: scale(0.96); }
  .btn-export.csv:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-export.txt:hover { border-color: var(--accent); color: var(--accent); }

  /* Search */
  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📦</div>
    WAREHOUSE SCAN
  </div>
  <div class="count-badge" id="totalCount">0 items</div>
</header>

<div class="container">

  <!-- Scanner -->
  <div class="scanner-section">
    <div class="scanner-header">
      <span class="scanner-title">카메라 스캐너</span>
      <div class="status-dot" id="statusDot"></div>
    </div>

    <div id="camera-view">
      <div class="dim-overlay"></div>
      <div class="scan-overlay">
        <div class="scan-frame">
          <div class="corner-bl"></div>
          <div class="corner-br"></div>
          <div class="scan-line-anim"></div>
        </div>
      </div>
    </div>

    <div class="camera-placeholder" id="cameraPlaceholder">
      <div class="cam-icon">📷</div>
      <div class="cam-hint">아래 버튼을 눌러 카메라를 켜고<br>바코드를 프레임 안에 맞춰주세요</div>
    </div>

    <button class="btn-scan" id="scanBtn" onclick="toggleScanner()">
      <span>📷</span> 카메라 시작
    </button>
  </div>

  <!-- Manual input -->
  <div class="manual-section">
    <div class="section-label">수동 입력</div>
    <div class="input-row">
      <input class="barcode-input" id="manualInput" type="text" placeholder="바코드 번호 직접 입력..." 
        inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"
        onkeydown="if(event.key==='Enter') addManual()">
      <button class="btn-add" onclick="addManual()">+</button>
    </div>
  </div>

  <!-- List -->
  <div class="list-section">
    <div class="list-header">
      <span class="section-label" style="margin:0">스캔 목록</span>
      <div class="list-actions">
        <button class="btn-small" onclick="toggleSearch()">🔍 검색</button>
        <button class="btn-small danger" onclick="clearAll()">전체 삭제</button>
      </div>
    </div>

    <div style="padding: 8px 8px 0; display:none" id="searchWrapper">
      <input class="search-input" id="searchInput" placeholder="바코드 검색..." oninput="renderList()" autocomplete="off">
    </div>

    <div id="listContainer">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        스캔된 바코드가 없습니다<br>카메라로 스캔하거나 직접 입력하세요
      </div>
    </div>
  </div>

  <!-- Export -->
  <div class="export-section">
    <div class="section-label">내보내기</div>
    <div class="export-buttons">
      <button class="btn-export csv" onclick="exportCSV()">📊 CSV 저장</button>
      <button class="btn-export txt" onclick="exportTXT()">📄 TXT 저장</button>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let barcodes = JSON.parse(localStorage.getItem('wh_barcodes') || '[]');
let scanning = false;
let lastScanned = '';
let lastScannedTime = 0;
let searchVisible = false;

function save() {
  localStorage.setItem('wh_barcodes', JSON.stringify(barcodes));
}

function showToast(msg, isDuplicate = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isDuplicate ? ' duplicate' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 2000);
}

function addBarcode(code) {
  const trimmed = code.trim();
  if (!trimmed) return;

  const now = Date.now();
  // 중복 방지 (2초 내 같은 코드)
  if (trimmed === lastScanned && now - lastScannedTime < 2000) return;
  lastScanned = trimmed;
  lastScannedTime = now;

  // 중복 체크
  if (barcodes.find(b => b.code === trimmed)) {
    showToast('⚠️ 이미 등록된 바코드', true);
    return;
  }

  const time = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  barcodes.unshift({ code: trimmed, time, id: now });
  save();
  renderList();
  updateCount();
  showToast('✓ ' + trimmed + ' 추가됨');
}

function addManual() {
  const input = document.getElementById('manualInput');
  if (input.value.trim()) {
    addBarcode(input.value);
    input.value = '';
  }
}

function deleteItem(id) {
  barcodes = barcodes.filter(b => b.id !== id);
  save();
  renderList();
  updateCount();
}

function clearAll() {
  if (barcodes.length === 0) return;
  if (confirm(`${barcodes.length}개 항목을 모두 삭제할까요?`)) {
    barcodes = [];
    save();
    renderList();
    updateCount();
  }
}

function updateCount() {
  document.getElementById('totalCount').textContent = barcodes.length + ' items';
}

function renderList() {
  const container = document.getElementById('listContainer');
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const filtered = query ? barcodes.filter(b => b.code.toLowerCase().includes(query)) : barcodes;

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      ${query ? '검색 결과 없음' : '스캔된 바코드가 없습니다<br>카메라로 스캔하거나 직접 입력하세요'}
    </div>`;
    return;
  }

  const total = barcodes.length;
  container.innerHTML = '<div class="barcode-list">' + filtered.map((b, i) => {
    const num = total - barcodes.indexOf(b);
    const isNew = (Date.now() - b.id) < 3000;
    return `<div class="barcode-item ${isNew ? 'new-item' : ''}">
      <span class="item-num">#${num}</span>
      <span class="item-barcode">${highlight(b.code, query)}</span>
      <span class="item-time">${b.time}</span>
      <button class="btn-delete" onclick="deleteItem(${b.id})">✕</button>
    </div>`;
  }).join('') + '</div>';
}

function highlight(text, query) {
  if (!query) return text;
  const idx = text.toLowerCase().indexOf(query);
  if (idx === -1) return text;
  return text.slice(0, idx) + 
    `<span style="color:var(--accent);background:rgba(0,212,255,0.15);border-radius:3px;padding:0 2px">` +
    text.slice(idx, idx + query.length) + `</span>` +
    text.slice(idx + query.length);
}

function toggleSearch() {
  searchVisible = !searchVisible;
  const wrapper = document.getElementById('searchWrapper');
  wrapper.style.display = searchVisible ? 'block' : 'none';
  if (searchVisible) document.getElementById('searchInput').focus();
  else { document.getElementById('searchInput').value = ''; renderList(); }
}

// Scanner
function toggleScanner() {
  scanning ? stopScanner() : startScanner();
}

function startScanner() {
  const view = document.getElementById('camera-view');
  const placeholder = document.getElementById('cameraPlaceholder');
  const btn = document.getElementById('scanBtn');
  const dot = document.getElementById('statusDot');

  view.classList.add('visible');
  placeholder.style.display = 'none';
  btn.innerHTML = '<span>⏹</span> 스캔 중지';
  btn.classList.add('stop');
  dot.className = 'status-dot scanning';
  scanning = true;

  Quagga.init({
    inputStream: {
      name: "Live",
      type: "LiveStream",
      target: view,
      constraints: {
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 },
      },
    },
    locator: { patchSize: "medium", halfSample: true },
    numOfWorkers: 2,
    decoder: {
      readers: [
        "code_128_reader", "ean_reader", "ean_8_reader",
        "code_39_reader", "code_39_vin_reader",
        "codabar_reader", "upc_reader", "upc_e_reader",
        "i2of5_reader", "2of5_reader", "code_93_reader"
      ]
    },
    locate: true,
  }, function(err) {
    if (err) {
      console.error(err);
      showToast('❌ 카메라 접근 실패', true);
      stopScanner();
      return;
    }
    Quagga.start();
  });

  Quagga.onDetected(onDetected);
}

function stopScanner() {
  Quagga.stop();
  Quagga.offDetected(onDetected);
  const view = document.getElementById('camera-view');
  const placeholder = document.getElementById('cameraPlaceholder');
  const btn = document.getElementById('scanBtn');
  const dot = document.getElementById('statusDot');

  view.classList.remove('visible');
  placeholder.style.display = 'block';
  btn.innerHTML = '<span>📷</span> 카메라 시작';
  btn.classList.remove('stop');
  dot.className = 'status-dot active';
  scanning = false;
}

let detectedBuffer = [];
function onDetected(result) {
  const code = result.codeResult.code;
  detectedBuffer.push(code);
  if (detectedBuffer.length > 5) detectedBuffer.shift();
  const freq = detectedBuffer.filter(c => c === code).length;
  if (freq >= 3) {
    detectedBuffer = [];
    addBarcode(code);
    // 진동 피드백
    if (navigator.vibrate) navigator.vibrate(80);
  }
}

// Export
function exportCSV() {
  if (barcodes.length === 0) { showToast('내보낼 데이터 없음', true); return; }
  const header = 'No,바코드,스캔시간\n';
  const rows = barcodes.map((b, i) => `${barcodes.length - i},"${b.code}","${b.time}"`).join('\n');
  const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8;' });
  download(blob, `barcodes_${dateStr()}.csv`);
}

function exportTXT() {
  if (barcodes.length === 0) { showToast('내보낼 데이터 없음', true); return; }
  const lines = barcodes.map(b => b.code).join('\n');
  const blob = new Blob([lines], { type: 'text/plain;charset=utf-8;' });
  download(blob, `barcodes_${dateStr()}.txt`);
}

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  showToast('✓ 저장 완료');
}

function dateStr() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
}

// Init
renderList();
updateCount();

// Page hide = stop scanner
document.addEventListener('visibilitychange', () => {
  if (document.hidden && scanning) stopScanner();
});
