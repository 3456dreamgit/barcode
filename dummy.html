<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UnoVision</title>
<style>
  :root {
    --bg: #0a0e14;
    --surface: #111720;
    --border: #1e2d40;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --text: #e0eeff;
    --muted: #4a6080;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Roboto, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 24px;
    text-align: center;
  }

  /* 로고 */
  .brand { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .brand-main { font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--accent); }
  .brand-ver  { font-family: 'Courier New', monospace; font-size: 9px; letter-spacing: 1px; color: var(--muted); }

  /* 스피너 */
  .spinner {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-right-color: var(--accent2);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 상태 텍스트 */
  .status { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 10px; }
  .status .dots::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }
  .sub { font-size: 12px; color: var(--muted); margin-top: 10px; }

  /* 초기화 버튼 */
  .reset-btn {
    margin-top: 10px;
    padding: 12px 30px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 24px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all .15s;
  }
  .reset-btn:active {
    transform: scale(.95);
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <span class="brand-main">UNOVISION</span>
    <span class="brand-ver">d2609210000</span>
  </div>

  <div class="spinner"></div>

  <div>
    <div class="status">처리 중입니다<span class="dots"></span></div>
    <div class="sub">화면이 계속 멈춰있다면 아래의 초기화 버튼을 눌러주세요</div>
  </div>

  <button class="reset-btn" onclick="location.href='uno://init?'">초기화</button>
</div>

</body>
</html>
