<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UnoVision Barcode Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0e14;
    --surface: #111720;
    --surface2: #1a2230;
    --border: #1e2d40;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ff4444;
    --text: #e0eeff;
    --muted: #4a6080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
  .logo-main { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
  .logo-sub  { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 400; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .count-badge { display: none; }

  .container { padding: 14px; max-width: 480px; margin: 0 auto; }

  /* ── 바코드 입력 ── */
  .manual-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .sec-lbl { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .scan-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .scan-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 6px var(--accent2); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .input-row { display: flex; gap: 8px; }
  .barcode-input {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 14px 13px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    outline: none;
    caret-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
  }
  .input-hint { margin-top: 8px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .btn-add { background: var(--accent2); border: none; border-radius: 10px; color: var(--bg); font-weight: 700; font-size: 22px; width: 46px; cursor: pointer; transition: all .15s; }
  .btn-add:active { transform: scale(.9); }

  /* ── 마지막 인식 ── */
  .last-bar { margin: 12px 0 0; padding: 9px 13px; background: rgba(0,255,157,.07); border: 1px solid rgba(0,255,157,.22); border-radius: 9px; display: none; align-items: center; gap: 8px; }
  .last-bar.on { display: flex; }
  .last-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--accent2); white-space: nowrap; text-transform: uppercase; }
  .last-code { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); word-break: break-all; }

  /* ── 숫자 키패드 모달 ── */
  .keypad-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 1000; backdrop-filter: blur(3px);
  }
  .keypad-backdrop.show { display: flex; }
  .keypad-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px 20px 0 0; padding: 16px;
    width: 100%; max-width: 480px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .keypad-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .keypad-title { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .keypad-preview { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: var(--accent); min-height: 28px; letter-spacing: 2px; word-break: break-all; }
  .keypad-close { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 700; padding: 6px 12px; cursor: pointer; }
  .keypad-close:active { color: var(--warn); }
  .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .kp-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; padding: 18px 0; cursor: pointer; transition: all .1s; text-align: center; }
  .kp-btn:active { background: var(--border); transform: scale(.94); }
  .kp-btn.del { font-size: 16px; color: var(--warn); }
  .kp-btn.confirm { grid-column: span 2; background: linear-gradient(135deg, var(--accent2), #00cc7a); color: var(--bg); font-size: 15px; border: none; }
  .kp-btn.confirm:active { opacity: .85; }

  /* ── 거래처/매장/수량/단위 폼 ── */
  .form-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .form-field { display: flex; flex-direction: column; gap: 6px; }
  .form-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .form-select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px 30px 10px 10px; color: var(--text);
    font-family: 'Noto Sans KR', sans-serif; font-size: 13px; outline: none;
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a6080' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center; background-size: 16px;
  }
  .form-select:focus { border-color: var(--accent); }
  .form-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-form { padding: 13px; border: none; border-radius: 10px; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .btn-form:active { transform: scale(.96); }
  .btn-form.in  { background: linear-gradient(135deg, var(--accent2), #00cc7a); color: var(--bg); }
  .btn-form.ret { background: linear-gradient(135deg, var(--warn), #cc2200); color: var(--bg); }

  /* ── 토스트 ── */
  .toast { position: fixed; top: 74px; left: 50%; transform: translateX(-50%) translateY(-14px); background: var(--accent2); color: var(--bg); font-weight: 700; font-size: 13px; padding: 9px 18px; border-radius: 24px; opacity: 0; transition: all .25s; z-index: 1500; white-space: nowrap; pointer-events: none; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.dup  { background: var(--warn); }

  /* ── 관리 메뉴 ── */
  .menu-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 13px; margin-bottom: 28px; }
  .menu-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .btn-menu { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .btn-menu:active { transform: scale(.95); border-color: var(--accent); }
  .btn-menu .ic { font-size: 22px; }

  /* ── 개발중 모달 ── */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(3px); }
  .modal-backdrop.show { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 28px 24px 20px; width: 80%; max-width: 300px; text-align: center; animation: modalPop .2s ease; }
  @keyframes modalPop { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }
  .modal-icon { font-size: 38px; margin-bottom: 10px; }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .modal-desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
  .modal-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--accent), #0099cc); border: none; border-radius: 10px; color: var(--bg); font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s; }
  .modal-btn:active { transform: scale(.96); }
</style>
</head>

<script>
// ================================================================
// UNOVISION UPv2609151433
// ================================================================
// 주요 기능:
//   1. HID 외장 스캐너 입력 → 바코드 입력란 자동 수신
//   2. + 버튼 → 숫자 키패드 팝업 → 수동 바코드 입력
//   3. 바코드 확정 시 → uno://search?바코드 → Delphi 전달
//   4. 입고 버튼 → uno://save?바코드|거래처|매장명|수량|단위
//    반품 버튼 → uno://return?바코드|거래처|매장명|수량|단위
//   5. 어디를 클릭해도 바코드 입력란에 항상 커서 유지
//   6. 안드로이드 소프트 키보드 차단 (readonly + inputmode=none)
// ================================================================


// ================================================================
// URL 파라미터
//   index.html?partners=대한식품,한국유통,서울물류센터&stores=강남점,홍대점,인천점
//
// partners / stores가 없으면 기본적으로 "선택하세요"만 표시한다.
// URLSearchParams가 URL 디코딩을 처리하므로 한글/한글 인코딩 URL 모두 대응한다.
// ================================================================
function getUrlList(paramName) {
  const params = new URLSearchParams(window.location.search);
  const value = params.get(paramName);

  if (!value) return [];

  return value
    .split(',')
    .map(v => v.trim())
    .filter(v => v.length > 0);
}

function fillSelect(selectId, values) {
  const select = document.getElementById(selectId);

  // 기존 항목을 모두 삭제하고 "선택하세요"만 유지
  select.innerHTML = '<option value="">선택하세요</option>';

  values.forEach(function(value) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;
    select.appendChild(option);
  });

  // 첫 번째 항목을 자동 선택하지 않고 "선택하세요" 상태로 유지
  select.value = '';
}

function applyUrlParameters() {
  const partners = getUrlList('partners');
  const stores   = getUrlList('stores');

  fillSelect('partnerSelect', partners);
  fillSelect('storeSelect', stores);
}

let inputBuffer  = '';
let keypadBuffer = '';

const manualInput = () => document.getElementById('manualInput');

function focusInput() {
  const el = manualInput();
  if (document.activeElement !== el) el.focus({ preventScroll: true });
}

function isExemptTarget(el) {
  return el.id === 'manualInput'
    || el.tagName === 'BUTTON'
    || el.tagName === 'INPUT'
    || el.tagName === 'SELECT'
    || el.tagName === 'OPTION';
}

window.addEventListener('load', function() {
  applyUrlParameters();
  focusInput();
});
document.addEventListener('mousedown',  (e) => { if (!isExemptTarget(e.target)) setTimeout(focusInput, 0); });
document.addEventListener('touchstart', (e) => { if (!isExemptTarget(e.target)) setTimeout(focusInput, 0); });

manualInput().addEventListener('blur', () => {
  const anyOpen = document.getElementById('devModal').classList.contains('show')
               || document.getElementById('keypadModal').classList.contains('show');
  setTimeout(() => {
    if (!anyOpen && !isExemptTarget(document.activeElement)) focusInput();
  }, 10);
});

setInterval(() => {
  const anyOpen = document.getElementById('devModal').classList.contains('show')
               || document.getElementById('keypadModal').classList.contains('show');
  if (!anyOpen && !isExemptTarget(document.activeElement)) focusInput();
}, 800);

function handleKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (inputBuffer.trim()) {
      onBarcodeReady(inputBuffer);
      inputBuffer = '';
      manualInput().value = '';
    }
    return;
  }
  if (e.key.length === 1) {
    e.preventDefault();
    inputBuffer += e.key;
    manualInput().value = inputBuffer;
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    inputBuffer = inputBuffer.slice(0, -1);
    manualInput().value = inputBuffer;
  }
}

function onBarcodeReady(code) {
  const s = (code || '').trim();
  if (!s) return;

  manualInput().value = s;
  inputBuffer = s;
  document.getElementById('lastCode').textContent = s;
  document.getElementById('lastBar').classList.add('on');
  showToast('✓ 스캔: ' + s);
  if (navigator.vibrate) navigator.vibrate([60, 30, 60]);

  window.location = 'uno://search?' + s;
}

function openKeypad() {
  keypadBuffer = inputBuffer;
  document.getElementById('keypadPreview').textContent = keypadBuffer || '—';
  document.getElementById('keypadModal').classList.add('show');
}

function closeKeypad() {
  document.getElementById('keypadModal').classList.remove('show');
  focusInput();
}

function kpInput(num) {
  keypadBuffer += num;
  document.getElementById('keypadPreview').textContent = keypadBuffer || '—';
  manualInput().value = keypadBuffer;
  inputBuffer = keypadBuffer;
  if (navigator.vibrate) navigator.vibrate(40);  // 키패드 숫자 클릭 시 진동
}

function kpDelete() {
  keypadBuffer = keypadBuffer.slice(0, -1);
  document.getElementById('keypadPreview').textContent = keypadBuffer || '—';
  manualInput().value = keypadBuffer;
  inputBuffer = keypadBuffer;
}

function kpClear() {
  keypadBuffer = '';
  document.getElementById('keypadPreview').textContent = '—';
  manualInput().value = '';
  inputBuffer = '';
}

function kpConfirm() {
  const code = keypadBuffer.trim();
  closeKeypad();
  if (code) {
    onBarcodeReady(code);
    inputBuffer  = '';
    keypadBuffer = '';
    manualInput().value = '';
  }
}

function showToast(msg, isDup = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isDup ? ' dup' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 2200);
}

function getScanNow() {
  window.location = 'uno://scanNow?';
}

function getGoodsInHistory() {
  window.location = 'uno://History?123456789012';
}

function getGoodsStockCheck() {
  window.location = 'uno://Stock?123456789012';
}

function openDevModal()  { document.getElementById('devModal').classList.add('show'); }
function closeDevModal() { document.getElementById('devModal').classList.remove('show'); focusInput(); }

function sendToNativeApp(cmd) {
  const partner = document.getElementById('partnerSelect').value;
  const store   = document.getElementById('storeSelect').value;
  const qty     = document.getElementById('qtySelect').value;
  const unit    = document.getElementById('unitSelect').value;

  if (!partner || !store) {
    showToast('⚠️ 거래처/매장명을 선택하세요', true);
    return;
  }

  const barcode = inputBuffer.trim() || '123456789012';

  window.location = 'uno://' + cmd + '?' +
    barcode + '|' + partner + '|' + store + '|' + qty + '|' + unit;
}

focusInput();
</script>
