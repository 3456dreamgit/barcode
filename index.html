<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UnoVision Barcode Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0e14;
    --surface: #111720;
    --surface2: #1a2230;
    --border: #1e2d40;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ff4444;
    --text: #e0eeff;
    --muted: #4a6080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
  .logo-main { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
  .logo-sub  { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 400; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

  .count-badge { display: none; }

  .container { padding: 14px; max-width: 480px; margin: 0 auto; }

  /* ── 바코드 입력 ── */
  .manual-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .sec-lbl { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }

  .scan-indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .scan-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 6px var(--accent2); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .input-row { display: flex; gap: 8px; position: relative; }

  .barcode-input {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 14px 13px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    outline: none;
    caret-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
  }

  .input-hint { margin-top: 8px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

  .btn-add { background: var(--accent2); border: none; border-radius: 10px; color: var(--bg); font-weight: 700; font-size: 22px; width: 46px; cursor: pointer; transition: all .15s; }
  .btn-add:active { transform: scale(.9); }

  /* ── 숫자 키패드 모달 ── */
  .keypad-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(3px);
  }
  .keypad-backdrop.show { display: flex; }

  .keypad-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    padding: 16px;
    width: 100%;
    max-width: 480px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

  .keypad-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .keypad-title { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

  /* 키패드 입력 미리보기 */
  .keypad-preview {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    min-height: 28px;
    letter-spacing: 2px;
    word-break: break-all;
  }

  .keypad-close {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    cursor: pointer;
  }
  .keypad-close:active { color: var(--warn); }

  .keypad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }

  .kp-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    padding: 18px 0;
    cursor: pointer;
    transition: all .1s;
    text-align: center;
  }
  .kp-btn:active { background: var(--border); transform: scale(.94); }
  .kp-btn.del { font-size: 16px; color: var(--warn); }
  .kp-btn.confirm {
    grid-column: span 2;
    background: linear-gradient(135deg, var(--accent2), #00cc7a);
    color: var(--bg);
    font-size: 15px;
    border: none;
  }
  .kp-btn.confirm:active { opacity: .85; }

  /* ── 거래처/매장/수량/단위 폼 ── */
  .form-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 14px; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .form-field { display: flex; flex-direction: column; gap: 6px; }

  .form-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }

  .form-select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 30px 10px 10px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a6080' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
  }
  .form-select:focus { border-color: var(--accent); }

  .form-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .btn-form {
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-form:active { transform: scale(.96); }
  .btn-form.in  { background: linear-gradient(135deg, var(--accent2), #00cc7a); color: var(--bg); }
  .btn-form.ret { background: linear-gradient(135deg, var(--warn), #cc2200); color: var(--bg); }

  /* ── 마지막 인식 ── */
  .last-bar { margin: 12px 0 0; padding: 9px 13px; background: rgba(0,255,157,.07); border: 1px solid rgba(0,255,157,.22); border-radius: 9px; display: none; align-items: center; gap: 8px; }
  .last-bar.on { display: flex; }
  .last-lbl { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--accent2); white-space: nowrap; text-transform: uppercase; }
  .last-code { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); word-break: break-all; }

  /* ── 토스트 ── */
  .toast { position: fixed; top: 74px; left: 50%; transform: translateX(-50%) translateY(-14px); background: var(--accent2); color: var(--bg); font-weight: 700; font-size: 13px; padding: 9px 18px; border-radius: 24px; opacity: 0; transition: all .25s; z-index: 1500; white-space: nowrap; pointer-events: none; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.dup  { background: var(--warn); }

  /* ── 관리 메뉴 ── */
  .menu-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 13px; margin-bottom: 28px; }
  .menu-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .btn-menu {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 16px 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .15s;
  }
  .btn-menu:active { transform: scale(.95); border-color: var(--accent); }
  .btn-menu .ic { font-size: 22px; }

  /* ── 개발중 모달 ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(3px);
  }
  .modal-backdrop.show { display: flex; }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 24px 20px;
    width: 80%;
    max-width: 300px;
    text-align: center;
    animation: modalPop .2s ease;
  }
  @keyframes modalPop { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }

  .modal-icon { font-size: 38px; margin-bottom: 10px; }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .modal-desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }

  .modal-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
  }
  .modal-btn:active { transform: scale(.96); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔍</div>
    <div class="logo-text">
      <span class="logo-main">UNOVISION v2608191455</span>
      <span class="logo-sub">Barcode Scanner</span>
    </div>
  </div>
  <div class="count-badge" id="totalCount">0 items</div>
</header>

<div class="container">

  <!-- 바코드 입력 -->
  <div class="manual-section">
    <div class="sec-lbl">
      바코드 입력
      <span class="scan-indicator"><span class="scan-dot"></span>입력 대기중</span>
    </div>
    <div class="input-row">
      <input class="barcode-input" id="manualInput" type="text"
        inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false"
        readonly
        onkeydown="handleKey(event)">
      <button class="btn-add" onclick="openKeypad()">+</button>
    </div>
    <div class="input-hint">📡 외장 스캐너로 바코드를 찍으면 자동 인식됩니다</div>

    <div class="last-bar" id="lastBar">
      <span class="last-lbl">LAST</span>
      <span class="last-code" id="lastCode">—</span>
    </div>
  </div>

  <!-- 거래처/매장/수량/단위 -->
  <div class="form-section">
    <div class="form-grid">
      <div class="form-field">
        <span class="form-label">거래처</span>
        <select class="form-select" id="partnerSelect">
          <option value="">선택하세요</option>
          <option value="대한식품">대한식품</option>
          <option value="한국유통">한국유통</option>
          <option value="서울물류센터">서울물류센터</option>
          <option value="동부상사">동부상사</option>
          <option value="태양물산">태양물산</option>
        </select>
      </div>
      <div class="form-field">
        <span class="form-label">매장명</span>
        <select class="form-select" id="storeSelect">
          <option value="">선택하세요</option>
          <option value="강남점">강남점</option>
          <option value="홍대점">홍대점</option>
          <option value="인천점">인천점</option>
          <option value="송도점">송도점</option>
          <option value="본점창고">본점창고</option>
        </select>
      </div>
      <div class="form-field">
        <span class="form-label">수량</span>
        <select class="form-select" id="qtySelect">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      <div class="form-field">
        <span class="form-label">단위</span>
        <select class="form-select" id="unitSelect">
          <option value="EA">EA (개)</option>
          <option value="BOX">BOX (박스)</option>
          <option value="SET">SET (세트)</option>
          <option value="PACK">PACK (팩)</option>
          <option value="KG">KG (킬로그램)</option>
        </select>
      </div>
    </div>
    <div class="form-btns">
      <button class="btn-form in"  onclick="sendToNativeApp('save')">📥 입고</button>
      <button class="btn-form ret" onclick="sendToNativeApp('save')">↩️ 반품</button>
    </div>
  </div>

  <!-- 관리 메뉴 -->
  <div class="menu-section">
    <div class="menu-btns">
      <button class="btn-menu in"    onclick="openDevModal()"><span class="ic">📥</span>입고관리</button>
      <button class="btn-menu out"   onclick="openDevModal()"><span class="ic">↩️</span>반품관리</button>
      <button class="btn-menu stock" onclick="openDevModal()"><span class="ic">📊</span>재고관리</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- 개발중 모달 -->
<div class="modal-backdrop" id="devModal">
  <div class="modal-box">
    <div class="modal-icon">🚧</div>
    <div class="modal-title">개발중</div>
    <div class="modal-desc">해당 기능은 현재 준비 중입니다.<br>곧 업데이트될 예정입니다.</div>
    <button class="modal-btn" onclick="closeDevModal()">확인</button>
  </div>
</div>

<!-- 숫자 키패드 모달 -->
<div class="keypad-backdrop" id="keypadModal">
  <div class="keypad-box">
    <div class="keypad-header">
      <div>
        <div class="keypad-title">수동 입력</div>
        <div class="keypad-preview" id="keypadPreview">—</div>
      </div>
      <button class="keypad-close" onclick="closeKeypad()">닫기</button>
    </div>
    <div class="keypad-grid">
      <button class="kp-btn" onclick="kpInput('1')">1</button>
      <button class="kp-btn" onclick="kpInput('2')">2</button>
      <button class="kp-btn" onclick="kpInput('3')">3</button>
      <button class="kp-btn" onclick="kpInput('4')">4</button>
      <button class="kp-btn" onclick="kpInput('5')">5</button>
      <button class="kp-btn" onclick="kpInput('6')">6</button>
      <button class="kp-btn" onclick="kpInput('7')">7</button>
      <button class="kp-btn" onclick="kpInput('8')">8</button>
      <button class="kp-btn" onclick="kpInput('9')">9</button>
      <button class="kp-btn del" onclick="kpDelete()">⌫</button>
      <button class="kp-btn" onclick="kpInput('0')">0</button>
      <button class="kp-btn del" onclick="kpClear()">C</button>
    </div>
    <div class="keypad-grid">
      <button class="kp-btn confirm" onclick="kpConfirm()">✓ 확인</button>
      <button class="kp-btn del" style="font-size:13px" onclick="kpClear()">전체삭제</button>
    </div>
  </div>
</div>

<script>
// ── 상태 ────────────────────────────────────────────────────────
let inputBuffer  = '';   // HID 스캐너 버퍼
let keypadBuffer = '';   // 수동 키패드 버퍼
let keypadOpen   = false;

// ── 입력창 참조 ──────────────────────────────────────────────────
const manualInput = () => document.getElementById('manualInput');

// ── 포커스 유지 ──────────────────────────────────────────────────
function focusInput() {
  const el = manualInput();
  if (document.activeElement !== el) {
    el.focus({ preventScroll: true });
  }
}

window.addEventListener('load', focusInput);

function isExemptTarget(el) {
  return el.id === 'manualInput'
    || el.tagName === 'BUTTON'
    || el.tagName === 'INPUT'
    || el.tagName === 'SELECT'
    || el.tagName === 'OPTION';
}

document.addEventListener('mousedown', (e) => {
  if (!isExemptTarget(e.target)) setTimeout(focusInput, 0);
});
document.addEventListener('touchstart', (e) => {
  if (!isExemptTarget(e.target)) setTimeout(focusInput, 0);
});

manualInput().addEventListener('blur', () => {
  const anyModalOpen = document.getElementById('devModal').classList.contains('show')
                    || document.getElementById('keypadModal').classList.contains('show');
  setTimeout(() => {
    if (!anyModalOpen && !isExemptTarget(document.activeElement)) focusInput();
  }, 10);
});

setInterval(() => {
  const anyModalOpen = document.getElementById('devModal').classList.contains('show')
                    || document.getElementById('keypadModal').classList.contains('show');
  if (!anyModalOpen && !isExemptTarget(document.activeElement)) focusInput();
}, 800);

// ── HID 스캐너 키 처리 ──────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (inputBuffer.trim()) {
      onBarcodeReady(inputBuffer);
      inputBuffer = '';
      manualInput().value = '';
    }
    return;
  }
  if (e.key.length === 1) {
    e.preventDefault();
    inputBuffer += e.key;
    manualInput().value = inputBuffer;
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    inputBuffer = inputBuffer.slice(0, -1);
    manualInput().value = inputBuffer;
  }
}

// ── 바코드 확정 (HID 또는 수동 공통) ────────────────────────────
function onBarcodeReady(code) {
  const s = (code || '').trim();
  if (!s) return;

  // 바코드 입력란 & LAST 표시
  manualInput().value = s;
  inputBuffer = s;
  document.getElementById('lastCode').textContent = s;
  document.getElementById('lastBar').classList.add('on');
  showToast('✓ 스캔: ' + s);
  if (navigator.vibrate) navigator.vibrate([60, 30, 60]);

  // 바코드 확정 즉시 uno://search 로 전달
  window.location = 'uno://search?' + s;
}

// ── 숫자 키패드 ──────────────────────────────────────────────────
function openKeypad() {
  keypadBuffer = inputBuffer; // 기존 입력값 이어받기
  document.getElementById('keypadPreview').textContent = keypadBuffer || '—';
  document.getElementById('keypadModal').classList.add('show');
  keypadOpen = true;
}

function closeKeypad() {
  document.getElementById('keypadModal').classList.remove('show');
  keypadOpen = false;
  focusInput();
}

function kpInput(num) {
  keypadBuffer += num;
  document.getElementById('keypadPreview').textContent = keypadBuffer || '—';
  // 바코드 입력란에 실시간 반영
  manualInput().value = keypadBuffer;
  inputBuffer = keypadBuffer;
}

function kpDelete() {
  keypadBuffer = keypadBuffer.slice(0, -1);
  document.getElementById('keypadPreview').textContent = keypadBuffer || '—';
  manualInput().value = keypadBuffer;
  inputBuffer = keypadBuffer;
}

function kpClear() {
  keypadBuffer = '';
  document.getElementById('keypadPreview').textContent = '—';
  manualInput().value = '';
  inputBuffer = '';
}

function kpConfirm() {
  const code = keypadBuffer.trim();
  closeKeypad();
  if (code) {
    onBarcodeReady(code);
    // 확인 후 버퍼 초기화
    inputBuffer = '';
    keypadBuffer = '';
    manualInput().value = '';
  }
}

// ── 토스트 ───────────────────────────────────────────────────────
function showToast(msg, isDup = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isDup ? ' dup' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 2200);
}

// ── 개발중 모달 ──────────────────────────────────────────────────
function openDevModal() {
  document.getElementById('devModal').classList.add('show');
}
function closeDevModal() {
  document.getElementById('devModal').classList.remove('show');
  focusInput();
}

// ── 입고/반품 → 네이티브 앱 전달 ────────────────────────────────
// uno://save?바코드|거래처|매장명|수량|단위
function sendToNativeApp(cmd) {
  const partner = document.getElementById('partnerSelect').value;
  const store   = document.getElementById('storeSelect').value;
  const qty     = document.getElementById('qtySelect').value;
  const unit    = document.getElementById('unitSelect').value;

  if (!partner || !store) {
    showToast('⚠️ 거래처/매장명을 선택하세요', true);
    return;
  }

  // 바코드: 현재 입력란 값 사용 (없으면 테스트 고정값)
  const barcode = inputBuffer.trim() || '8809656327866';

  window.location = 'uno://' + cmd + '?' +
    barcode + '|' +
    partner + '|' +
    store   + '|' +
    qty     + '|' +
    unit;
}

// ── 초기화 ───────────────────────────────────────────────────────
focusInput();

// ================================================================
// API 응답 감지 → uno://엔드포인트명?XML 전달 (v2608191455 추가)
// ================================================================
// 동작 흐름:
//   Delphi WinHttpPost → WebBrowser1에 HTML 폼 로딩
//   → 서버 XML 응답이 WebBrowser1에 표시됨
//   → 이 스크립트가 페이지 로드 시 XML 감지
//   → 엔드포인트명 추출 후 uno://엔드포인트명?XML 전달
//   → Delphi WebBrowser1ShouldStartLoadWithRequest 에서 수신
//
// 지원 엔드포인트 (요청→응답 매핑):
//   getGoodsUnitCheck.do  → uno://getGoodsUnitCheck?~
//   getGoodsInHistory.do  → uno://getGoodsInHistory?~
//   getGoodsStockCheck.do → uno://getGoodsStockCheck?~
//   saveGoodsBuyInfo.do   → uno://saveGoodsBuyInfo?~
//   getStoreInfo.do       → uno://getStoreInfo?~
//   getDealInfo.do        → uno://getDealInfo?~
//
// XML이 짧으면(4000자 미만) → uno://엔드포인트명?XML전체
// XML이 길면(4000자 이상)   → localStorage에 저장 후
//                             uno://엔드포인트명?__local__
//   Delphi에서 localStorage 읽는 JS 실행:
//   WebBrowser1.EvaluateJavaScript('localStorage.getItem("unoApiResult")')
// ================================================================

// 감지할 엔드포인트 목록 (.do 제거한 이름으로 매핑)
var API_ENDPOINTS = [
  'getGoodsUnitCheck',
  'getGoodsInHistory',
  'getGoodsStockCheck',
  'saveGoodsBuyInfo',
  'getStoreInfo',
  'getDealInfo'
];

// URL 길이 제한 기준 (안드로이드 WebView 안전 기준)
var UNO_URL_MAX_LENGTH = 4000;

window.addEventListener('load', function() {
  // ── 1. 현재 페이지 URL에서 엔드포인트명 감지 ──────────────────
  var pageUrl  = window.location.href;
  var endpoint = '';

  for (var i = 0; i < API_ENDPOINTS.length; i++) {
    if (pageUrl.indexOf(API_ENDPOINTS[i] + '.do') >= 0) {
      endpoint = API_ENDPOINTS[i];
      break;
    }
  }

  // 엔드포인트가 없으면 메인 페이지 → 처리 안 함
  if (!endpoint) return;

  // ── 2. 페이지 본문에서 XML 추출 ───────────────────────────────
  // 서버 응답이 XML이면 body.innerText 또는 pre 태그 안에 있음
  var xmlText = '';
  var preEl   = document.querySelector('pre');
  if (preEl) {
    xmlText = preEl.innerText || preEl.textContent;
  } else {
    xmlText = document.body.innerText || document.body.textContent;
  }

  xmlText = (xmlText || '').trim();

  // XML 응답이 아니면 처리 안 함 (<RESULTS> 또는 <?xml 로 시작하는 경우만)
  if (xmlText.indexOf('<RESULTS>') < 0 && xmlText.indexOf('<?xml') < 0) return;

  // ── 3. uno:// URL로 Delphi에 전달 ────────────────────────────
  var encoded = encodeURIComponent(xmlText);
  var unoUrl  = 'uno://' + endpoint + '?' + encoded;

  if (unoUrl.length <= UNO_URL_MAX_LENGTH) {
    // ── 짧은 경우: URL에 직접 담아 전달
    window.location = unoUrl;
  } else {
    // ── 긴 경우: localStorage에 저장 후 신호만 전달
    // Delphi에서 아래 JS를 실행해서 읽어가면 됨:
    //   WebBrowser1.EvaluateJavaScript('localStorage.getItem("unoApiResult")')
    try {
      localStorage.setItem('unoApiResult',   xmlText);
      localStorage.setItem('unoApiEndpoint', endpoint);
    } catch(e) {}
    window.location = 'uno://' + endpoint + '?__local__';
  }
});
</script>
