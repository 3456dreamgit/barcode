<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>창고 바코드 스캐너</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0e14;
    --surface: #111720;
    --surface2: #1a2230;
    --border: #1e2d40;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ff4444;
    --text: #e0eeff;
    --muted: #4a6080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }

  .count-badge {
    background: var(--accent);
    color: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .container { padding: 16px; max-width: 480px; margin: 0 auto; }

  .scanner-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .scanner-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .scanner-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s;
  }
  .status-dot.scanning {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 0.8s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* html5-qrcode가 생성하는 뷰어 영역 */
  #qr-reader {
    width: 100%;
    background: #000;
    display: none;
  }
  #qr-reader.visible { display: block; }

  /* html5-qrcode 내부 스타일 덮어쓰기 */
  #qr-reader video {
    width: 100% !important;
    border-radius: 0 !important;
  }
  #qr-reader img { display: none !important; }
  #qr-reader__scan_region {
    background: #000;
  }
  #qr-reader__dashboard {
    display: none !important;
  }

  .camera-placeholder {
    padding: 40px 20px;
    text-align: center;
  }
  .cam-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
  .cam-hint { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* 마지막 스캔 결과 표시 */
  .last-scan {
    margin: 0 16px 12px;
    padding: 10px 14px;
    background: rgba(0, 255, 157, 0.08);
    border: 1px solid rgba(0, 255, 157, 0.3);
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent2);
    display: none;
    word-break: break-all;
  }
  .last-scan.visible { display: block; }

  .btn-scan {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: calc(100% - 32px);
    margin: 16px;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border: none;
    border-radius: 12px;
    color: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-scan:active { transform: scale(0.97); opacity: 0.85; }
  .btn-scan.stop { background: linear-gradient(135deg, var(--warn), #cc2200); }

  .manual-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .input-row { display: flex; gap: 8px; }

  .barcode-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .barcode-input:focus { border-color: var(--accent); }
  .barcode-input::placeholder { color: var(--muted); }

  .btn-add {
    background: var(--accent2);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    font-weight: 700;
    font-size: 20px;
    width: 46px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-add:active { transform: scale(0.92); }

  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--accent2);
    color: var(--bg);
    font-weight: 700;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 24px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.duplicate { background: var(--warn); }

  .list-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .list-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .list-actions { display: flex; gap: 8px; }

  .btn-small {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-small:active { transform: scale(0.95); }
  .btn-small.danger:active { color: var(--warn); }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 2;
  }
  .empty-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.3; }

  .barcode-list { padding: 8px; }

  .barcode-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 6px;
    animation: slideIn 0.25s ease;
  }
  .barcode-item.new-item { border-color: var(--accent2); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .item-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 24px;
    text-align: center;
  }

  .item-barcode {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
  }

  .item-time {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .btn-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    transition: all 0.2s;
    line-height: 1;
  }

  .export-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
  }

  .export-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn-export {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-export:active { transform: scale(0.96); }

  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    margin-bottom: 8px;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📦</div>
    WAREHOUSE SCAN
  </div>
  <div class="count-badge" id="totalCount">0 items</div>
</header>

<div class="container">

  <!-- Scanner -->
  <div class="scanner-section">
    <div class="scanner-header">
      <span class="scanner-title">카메라 스캐너</span>
      <div class="status-dot" id="statusDot"></div>
    </div>

    <div id="qr-reader"></div>

    <div class="camera-placeholder" id="cameraPlaceholder">
      <div class="cam-icon">📷</div>
      <div class="cam-hint">아래 버튼을 눌러 카메라를 켜고<br>바코드 / QR코드를 화면에 비춰주세요<br><br>
        <small style="color:var(--muted);font-size:11px">QR, EAN, Code128, UPC 등 지원</small>
      </div>
    </div>

    <div class="last-scan" id="lastScan"></div>

    <button class="btn-scan" id="scanBtn" onclick="toggleScanner()">
      📷 카메라 시작
    </button>
  </div>

  <!-- Manual input -->
  <div class="manual-section">
    <div class="section-label">수동 입력</div>
    <div class="input-row">
      <input class="barcode-input" id="manualInput" type="text" placeholder="바코드 번호 직접 입력..."
        inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"
        onkeydown="if(event.key==='Enter') addManual()">
      <button class="btn-add" onclick="addManual()">+</button>
    </div>
  </div>

  <!-- List -->
  <div class="list-section">
    <div class="list-header">
      <span class="section-label" style="margin:0">스캔 목록</span>
      <div class="list-actions">
        <button class="btn-small" onclick="toggleSearch()">🔍 검색</button>
        <button class="btn-small danger" onclick="clearAll()">전체 삭제</button>
      </div>
    </div>
    <div style="padding:8px 8px 0;display:none" id="searchWrapper">
      <input class="search-input" id="searchInput" placeholder="바코드 검색..." oninput="renderList()" autocomplete="off">
    </div>
    <div id="listContainer">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        스캔된 바코드가 없습니다<br>카메라로 스캔하거나 직접 입력하세요
      </div>
    </div>
  </div>

  <!-- Export -->
  <div class="export-section">
    <div class="section-label">내보내기</div>
    <div class="export-buttons">
      <button class="btn-export" onclick="exportCSV()">📊 CSV 저장</button>
      <button class="btn-export" onclick="exportTXT()">📄 TXT 저장</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let barcodes = JSON.parse(localStorage.getItem('wh_barcodes') || '[]');
let scanning = false;
let html5QrCode = null;
let lastScannedCode = '';
let lastScannedTime = 0;
let searchVisible = false;

function save() {
  localStorage.setItem('wh_barcodes', JSON.stringify(barcodes));
}

function showToast(msg, isDuplicate = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isDuplicate ? ' duplicate' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 2200);
}

function addBarcode(code) {
  const trimmed = code.trim();
  if (!trimmed) return;

  const now = Date.now();
  if (trimmed === lastScannedCode && now - lastScannedTime < 3000) return;
  lastScannedCode = trimmed;
  lastScannedTime = now;

  // 마지막 스캔 표시
  const lastScanEl = document.getElementById('lastScan');
  lastScanEl.textContent = '✓ ' + trimmed;
  lastScanEl.classList.add('visible');

  if (barcodes.find(b => b.code === trimmed)) {
    showToast('⚠️ 이미 등록된 바코드', true);
    return;
  }

  const time = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  barcodes.unshift({ code: trimmed, time, id: now });
  save();
  renderList();
  updateCount();
  showToast('✓ 추가됨: ' + trimmed);
  if (navigator.vibrate) navigator.vibrate(80);
}

function addManual() {
  const input = document.getElementById('manualInput');
  if (input.value.trim()) {
    addBarcode(input.value);
    input.value = '';
  }
}

function deleteItem(id) {
  barcodes = barcodes.filter(b => b.id !== id);
  save();
  renderList();
  updateCount();
}

function clearAll() {
  if (barcodes.length === 0) return;
  if (confirm(barcodes.length + '개 항목을 모두 삭제할까요?')) {
    barcodes = [];
    save();
    renderList();
    updateCount();
  }
}

function updateCount() {
  document.getElementById('totalCount').textContent = barcodes.length + ' items';
}

function renderList() {
  const container = document.getElementById('listContainer');
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const filtered = query ? barcodes.filter(b => b.code.toLowerCase().includes(query)) : barcodes;

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div>${query ? '검색 결과 없음' : '스캔된 바코드가 없습니다<br>카메라로 스캔하거나 직접 입력하세요'}</div>`;
    return;
  }

  const total = barcodes.length;
  container.innerHTML = '<div class="barcode-list">' + filtered.map(b => {
    const num = total - barcodes.indexOf(b);
    const isNew = (Date.now() - b.id) < 3000;
    const codeHtml = query ? b.code.replace(new RegExp(query, 'gi'), m => `<span style="color:var(--accent)">${m}</span>`) : b.code;
    return `<div class="barcode-item ${isNew ? 'new-item' : ''}">
      <span class="item-num">#${num}</span>
      <span class="item-barcode">${codeHtml}</span>
      <span class="item-time">${b.time}</span>
      <button class="btn-delete" onclick="deleteItem(${b.id})">✕</button>
    </div>`;
  }).join('') + '</div>';
}

function toggleSearch() {
  searchVisible = !searchVisible;
  const wrapper = document.getElementById('searchWrapper');
  wrapper.style.display = searchVisible ? 'block' : 'none';
  if (searchVisible) document.getElementById('searchInput').focus();
  else { document.getElementById('searchInput').value = ''; renderList(); }
}

// ── 스캐너 ──────────────────────────────────────────
async function toggleScanner() {
  scanning ? await stopScanner() : await startScanner();
}

async function startScanner() {
  const btn = document.getElementById('scanBtn');
  const dot = document.getElementById('statusDot');
  const placeholder = document.getElementById('cameraPlaceholder');
  const qrDiv = document.getElementById('qr-reader');

  try {
    html5QrCode = new Html5Qrcode("qr-reader");

    const config = {
      fps: 15,
      qrbox: { width: 260, height: 180 },
      aspectRatio: 1.5,
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.ITF,
      ],
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true  // 네이티브 BarcodeDetector API 사용 → 오토포커스 향상
      }
    };

    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        addBarcode(decodedText);
      },
      () => {} // 실패 콜백 무시
    );

    scanning = true;
    qrDiv.classList.add('visible');
    placeholder.style.display = 'none';
    btn.innerHTML = '⏹ 스캔 중지';
    btn.classList.add('stop');
    dot.className = 'status-dot scanning';

  } catch (err) {
    console.error(err);
    showToast('❌ 카메라 접근 실패: ' + err, true);
  }
}

async function stopScanner() {
  const btn = document.getElementById('scanBtn');
  const dot = document.getElementById('statusDot');
  const placeholder = document.getElementById('cameraPlaceholder');
  const qrDiv = document.getElementById('qr-reader');

  try {
    if (html5QrCode) {
      await html5QrCode.stop();
      html5QrCode.clear();
      html5QrCode = null;
    }
  } catch(e) {}

  scanning = false;
  qrDiv.classList.remove('visible');
  placeholder.style.display = 'block';
  btn.innerHTML = '📷 카메라 시작';
  btn.classList.remove('stop');
  dot.className = 'status-dot';
}

// Export
function exportCSV() {
  if (!barcodes.length) { showToast('내보낼 데이터 없음', true); return; }
  const rows = barcodes.map((b, i) => `${barcodes.length - i},"${b.code}","${b.time}"`).join('\n');
  const blob = new Blob(['\uFEFF' + 'No,바코드,스캔시간\n' + rows], { type: 'text/csv;charset=utf-8;' });
  dl(blob, 'barcodes_' + dateStr() + '.csv');
}

function exportTXT() {
  if (!barcodes.length) { showToast('내보낼 데이터 없음', true); return; }
  const blob = new Blob([barcodes.map(b => b.code).join('\n')], { type: 'text/plain;charset=utf-8;' });
  dl(blob, 'barcodes_' + dateStr() + '.txt');
}

function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  showToast('✓ 저장 완료');
}

function dateStr() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && scanning) stopScanner();
});

renderList();
updateCount();
</script>
</body>
</html>
