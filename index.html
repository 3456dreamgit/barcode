<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UnoVision Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0e14;
    --surface: #111720;
    --surface2: #1a2230;
    --border: #1e2d40;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ff4444;
    --text: #e0eeff;
    --muted: #4a6080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .logo-main {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent);
  }

  .logo-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .count-badge {
    background: var(--accent);
    color: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .container { padding: 16px; max-width: 480px; margin: 0 auto; }

  /* ── SCANNER ── */
  .scanner-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .scanner-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .scanner-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .scanner-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .status-dot.scanning {
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  /* html5-qrcode 뷰어 */
  #qr-reader {
    width: 100%;
    background: #000;
    display: none;
    position: relative;
  }
  #qr-reader.visible { display: block; }
  #qr-reader video {
    width: 100% !important;
    border-radius: 0 !important;
    display: block;
  }
  #qr-reader__dashboard { display: none !important; }
  #qr-reader__scan_region { background: #000; }
  #qr-reader__scan_region img { display: none !important; }

  /* 스캔 가이드 오버레이 */
  .scan-overlay-ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scan-box {
    position: relative;
    width: 70%;
    height: 38%;
    border: none;
  }

  .scan-box::before, .scan-box::after,
  .scan-box .c3, .scan-box .c4 {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--accent);
    border-style: solid;
  }
  .scan-box::before { top:0; left:0; border-width: 3px 0 0 3px; }
  .scan-box::after  { top:0; right:0; border-width: 3px 3px 0 0; }
  .scan-box .c3     { bottom:0; left:0; border-width: 0 0 3px 3px; }
  .scan-box .c4     { bottom:0; right:0; border-width: 0 3px 3px 0; }

  .scan-laser {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--accent) 30%, #fff 50%, var(--accent) 70%, transparent 100%);
    box-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
    animation: laserMove 2s ease-in-out infinite;
    top: 0;
  }
  @keyframes laserMove {
    0%   { top: 5%;  opacity: 1; }
    50%  { top: 95%; opacity: 0.8; }
    100% { top: 5%;  opacity: 1; }
  }

  .camera-placeholder {
    padding: 40px 20px;
    text-align: center;
  }
  .cam-icon { font-size: 52px; margin-bottom: 14px; opacity: 0.25; }
  .cam-hint { font-size: 13px; color: var(--muted); line-height: 1.8; }
  .format-tags {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .fmt-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    padding: 3px 8px;
  }

  /* 마지막 스캔 결과 */
  .last-scan-bar {
    margin: 0 12px 12px;
    padding: 10px 14px;
    background: rgba(0,255,157,0.07);
    border: 1px solid rgba(0,255,157,0.25);
    border-radius: 10px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  .last-scan-bar.visible { display: flex; }
  .last-scan-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent2);
    white-space: nowrap;
    text-transform: uppercase;
  }
  .last-scan-code {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
  }

  /* 스캔 버튼 */
  .btn-scan {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: calc(100% - 24px);
    margin: 0 12px 12px;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent) 0%, #0099cc 100%);
    border: none;
    border-radius: 12px;
    color: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-scan:active { transform: scale(0.97); }
  .btn-scan.stop { background: linear-gradient(135deg, var(--warn), #cc2200); }

  /* ── MANUAL ── */
  .manual-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .input-row { display: flex; gap: 8px; }

  .barcode-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .barcode-input:focus { border-color: var(--accent); }
  .barcode-input::placeholder { color: var(--muted); }

  .btn-add {
    background: var(--accent2);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    font-weight: 700;
    font-size: 22px;
    width: 46px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-add:active { transform: scale(0.9); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    top: 76px;
    left: 50%;
    transform: translateX(-50%) translateY(-16px);
    background: var(--accent2);
    color: var(--bg);
    font-weight: 700;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 24px;
    opacity: 0;
    transition: all 0.28s;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.dup  { background: var(--warn); }

  /* ── LIST ── */
  .list-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .list-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .list-actions { display: flex; gap: 6px; }

  .btn-small {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-small:active { transform: scale(0.94); color: var(--warn); }

  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    margin-bottom: 4px;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .empty-state {
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 2;
  }
  .empty-icon { font-size: 34px; margin-bottom: 8px; opacity: 0.25; }

  .barcode-list { padding: 8px; }

  .barcode-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    margin-bottom: 5px;
    animation: slideIn 0.22s ease;
    transition: border-color 0.3s;
  }
  .barcode-item.new-item { border-color: var(--accent2); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .item-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    min-width: 26px;
    text-align: right;
  }

  .item-info { flex: 1; min-width: 0; }

  .item-barcode {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
    line-height: 1.3;
  }

  .item-meta {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
  }

  .btn-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    padding: 5px;
    border-radius: 6px;
    transition: all 0.15s;
    line-height: 1;
    flex-shrink: 0;
  }
  .btn-delete:active { color: var(--warn); }

  /* ── EXPORT ── */
  .export-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 32px;
  }

  .export-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .btn-export {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-export:active { transform: scale(0.95); border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔍</div>
    <div class="logo-text">
      <span class="logo-main">UnoVision</span>
      <span class="logo-sub">Barcode Scanner</span>
    </div>
  </div>
  <div class="count-badge" id="totalCount">0 items</div>
</header>

<div class="container">

  <!-- Scanner -->
  <div class="scanner-section">
    <div class="scanner-header">
      <span class="scanner-title">카메라 스캐너</span>
      <div class="scanner-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">대기중</span>
      </div>
    </div>

    <div id="qr-reader">
      <div class="scan-overlay-ui">
        <div class="scan-box">
          <div class="c3"></div><div class="c4"></div>
          <div class="scan-laser"></div>
        </div>
      </div>
    </div>

    <div class="camera-placeholder" id="cameraPlaceholder">
      <div class="cam-icon">📷</div>
      <div class="cam-hint">
        카메라 시작 버튼을 누르고<br>바코드를 가이드 프레임에 맞춰주세요
      </div>
      <div class="format-tags">
        <span class="fmt-tag">QR Code</span>
        <span class="fmt-tag">EAN-13</span>
        <span class="fmt-tag">EAN-8</span>
        <span class="fmt-tag">Code 128</span>
        <span class="fmt-tag">Code 39</span>
        <span class="fmt-tag">UPC-A</span>
        <span class="fmt-tag">UPC-E</span>
        <span class="fmt-tag">Data Matrix</span>
        <span class="fmt-tag">ITF</span>
        <span class="fmt-tag">Aztec</span>
        <span class="fmt-tag">PDF417</span>
      </div>
    </div>

    <div class="last-scan-bar" id="lastScanBar">
      <span class="last-scan-label">LAST</span>
      <span class="last-scan-code" id="lastScanCode">—</span>
    </div>

    <button class="btn-scan" id="scanBtn" onclick="toggleScanner()">
      📷 카메라 시작
    </button>
  </div>

  <!-- Manual input -->
  <div class="manual-section">
    <div class="section-label">수동 입력</div>
    <div class="input-row">
      <input class="barcode-input" id="manualInput" type="text"
        placeholder="바코드 번호 직접 입력..."
        inputmode="text" autocomplete="off" autocorrect="off" spellcheck="false"
        onkeydown="if(event.key==='Enter') addManual()">
      <button class="btn-add" onclick="addManual()">+</button>
    </div>
  </div>

  <!-- List -->
  <div class="list-section">
    <div class="list-header">
      <span class="section-label" style="margin:0">스캔 목록</span>
      <div class="list-actions">
        <button class="btn-small" onclick="toggleSearch()">🔍 검색</button>
        <button class="btn-small" onclick="clearAll()">전체삭제</button>
      </div>
    </div>
    <div style="padding:8px 8px 0;display:none" id="searchWrapper">
      <input class="search-input" id="searchInput" placeholder="바코드 검색..." oninput="renderList()" autocomplete="off">
    </div>
    <div id="listContainer">
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        스캔된 바코드가 없습니다<br>카메라로 스캔하거나 직접 입력하세요
      </div>
    </div>
  </div>

  <!-- Export -->
  <div class="export-section">
    <div class="section-label">내보내기</div>
    <div class="export-buttons">
      <button class="btn-export" onclick="exportCSV()">📊 CSV 저장</button>
      <button class="btn-export" onclick="exportTXT()">📄 TXT 저장</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let barcodes = JSON.parse(localStorage.getItem('wh_barcodes') || '[]');
let scanning = false;
let html5QrCode = null;
let lastCode = '';
let lastCodeTime = 0;
let searchVisible = false;

function save() { localStorage.setItem('wh_barcodes', JSON.stringify(barcodes)); }

function showToast(msg, isDup = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isDup ? ' dup' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 2200);
}

function addBarcode(code) {
  const s = code.trim();
  if (!s) return;
  const now = Date.now();
  if (s === lastCode && now - lastCodeTime < 3000) return;
  lastCode = s;
  lastCodeTime = now;

  // 마지막 스캔 표시
  document.getElementById('lastScanCode').textContent = s;
  document.getElementById('lastScanBar').classList.add('visible');

  if (barcodes.find(b => b.code === s)) {
    showToast('⚠️ 이미 등록됨: ' + s, true);
    return;
  }

  const time = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  barcodes.unshift({ code: s, time, id: now });
  save();
  renderList();
  updateCount();
  showToast('✓ 등록: ' + s);
  if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
}

function addManual() {
  const el = document.getElementById('manualInput');
  if (el.value.trim()) { addBarcode(el.value); el.value = ''; }
}

function deleteItem(id) {
  barcodes = barcodes.filter(b => b.id !== id);
  save(); renderList(); updateCount();
}

function clearAll() {
  if (!barcodes.length) return;
  if (confirm(barcodes.length + '개 항목을 모두 삭제할까요?')) {
    barcodes = []; save(); renderList(); updateCount();
  }
}

function updateCount() {
  document.getElementById('totalCount').textContent = barcodes.length + ' items';
}

function renderList() {
  const container = document.getElementById('listContainer');
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const list = q ? barcodes.filter(b => b.code.toLowerCase().includes(q)) : barcodes;

  if (!list.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📋</div>${q ? '검색 결과 없음' : '스캔된 바코드가 없습니다<br>카메라로 스캔하거나 직접 입력하세요'}</div>`;
    return;
  }

  const total = barcodes.length;
  container.innerHTML = '<div class="barcode-list">' + list.map(b => {
    const num = total - barcodes.indexOf(b);
    const isNew = Date.now() - b.id < 4000;
    const codeHtml = q
      ? b.code.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'),
          m => `<span style="color:var(--accent);background:rgba(0,212,255,0.12);border-radius:3px">${m}</span>`)
      : b.code;
    return `<div class="barcode-item${isNew?' new-item':''}">
      <span class="item-num">#${num}</span>
      <div class="item-info">
        <div class="item-barcode">${codeHtml}</div>
        <div class="item-meta">${b.time}</div>
      </div>
      <button class="btn-delete" onclick="deleteItem(${b.id})">✕</button>
    </div>`;
  }).join('') + '</div>';
}

function toggleSearch() {
  searchVisible = !searchVisible;
  const w = document.getElementById('searchWrapper');
  w.style.display = searchVisible ? 'block' : 'none';
  if (searchVisible) document.getElementById('searchInput').focus();
  else { document.getElementById('searchInput').value = ''; renderList(); }
}

// ── 스캐너 ──────────────────────────────────────
async function toggleScanner() {
  scanning ? await stopScanner() : await startScanner();
}

async function startScanner() {
  const btn      = document.getElementById('scanBtn');
  const dot      = document.getElementById('statusDot');
  const statTxt  = document.getElementById('statusText');
  const ph       = document.getElementById('cameraPlaceholder');
  const qrDiv    = document.getElementById('qr-reader');

  try {
    html5QrCode = new Html5Qrcode("qr-reader", { verbose: false });

    // 갤럭시 노트20 최적화: 고해상도 + 연속 오토포커스
    const config = {
      fps: 15,
      qrbox: (w, h) => ({ width: Math.round(w * 0.72), height: Math.round(h * 0.42) }),
      aspectRatio: 1.6,
      videoConstraints: {
        facingMode: { exact: "environment" },
        width:  { ideal: 1920 },
        height: { ideal: 1080 },
        focusMode: "continuous",          // 연속 오토포커스
        advanced: [{ focusMode: "continuous" }]
      },
      // 지원 형식: 1D + 2D 전부
      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.AZTEC,
        Html5QrcodeSupportedFormats.PDF_417,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.MAXICODE,
      ],
      // 크롬 네이티브 BarcodeDetector API 우선 사용 (갤럭시 크롬에서 오토포커스 훨씬 좋음)
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    await html5QrCode.start(
      { facingMode: { exact: "environment" } },
      config,
      (decodedText) => addBarcode(decodedText),
      () => {}
    );

    // 카메라 스트림에 오토포커스 직접 적용
    applyAutoFocus();

    scanning = true;
    qrDiv.classList.add('visible');
    ph.style.display = 'none';
    btn.innerHTML = '⏹ 스캔 중지';
    btn.classList.add('stop');
    dot.className = 'status-dot scanning';
    statTxt.textContent = '스캔중';

  } catch (err) {
    console.error(err);
    // exact facingMode 실패 시 fallback
    try {
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 160 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
          ],
          experimentalFeatures: { useBarCodeDetectorIfSupported: true }
        },
        (decodedText) => addBarcode(decodedText),
        () => {}
      );
      scanning = true;
      qrDiv.classList.add('visible');
      ph.style.display = 'none';
      btn.innerHTML = '⏹ 스캔 중지';
      btn.classList.add('stop');
      dot.className = 'status-dot scanning';
      statTxt.textContent = '스캔중';
    } catch(e2) {
      showToast('❌ 카메라 접근 실패', true);
    }
  }
}

// 비디오 트랙에 직접 오토포커스 설정
function applyAutoFocus() {
  setTimeout(() => {
    const video = document.querySelector('#qr-reader video');
    if (!video) return;
    const stream = video.srcObject;
    if (!stream) return;
    const track = stream.getVideoTracks()[0];
    if (!track) return;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) {
      track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] })
        .catch(() => {});
    }
  }, 800);
}

async function stopScanner() {
  try {
    if (html5QrCode) {
      await html5QrCode.stop();
      html5QrCode.clear();
      html5QrCode = null;
    }
  } catch(e) {}

  scanning = false;
  document.getElementById('qr-reader').classList.remove('visible');
  document.getElementById('cameraPlaceholder').style.display = 'block';
  document.getElementById('scanBtn').innerHTML = '📷 카메라 시작';
  document.getElementById('scanBtn').classList.remove('stop');
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = '대기중';
}

// Export
function exportCSV() {
  if (!barcodes.length) { showToast('내보낼 데이터 없음', true); return; }
  const rows = barcodes.map((b, i) => `${barcodes.length-i},"${b.code}","${b.time}"`).join('\n');
  dl(new Blob(['\uFEFF바코드번호,코드,스캔시간\n' + rows], {type:'text/csv;charset=utf-8;'}), 'unovision_' + ds() + '.csv');
}
function exportTXT() {
  if (!barcodes.length) { showToast('내보낼 데이터 없음', true); return; }
  dl(new Blob([barcodes.map(b=>b.code).join('\n')], {type:'text/plain;charset=utf-8;'}), 'unovision_' + ds() + '.txt');
}
function dl(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  showToast('✓ 저장 완료');
}
function ds() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

document.addEventListener('visibilitychange', () => { if (document.hidden && scanning) stopScanner(); });

renderList();
updateCount();
</script>
