<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UnoVision Barcode Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0e14;
    --surface: #111720;
    --surface2: #1a2230;
    --border: #1e2d40;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --warn: #ff4444;
    --text: #e0eeff;
    --muted: #4a6080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
  .logo-main { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: var(--accent); }
  .logo-sub  { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 400; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

  .count-badge { background: var(--accent); color: var(--bg); font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

  .container { padding: 14px; max-width: 480px; margin: 0 auto; }

  /* ── 바코드 입력 ── */
  .manual-section { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:14px; }
  .sec-lbl { font-size:11px; font-weight:700; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }

  .scan-indicator { display:flex; align-items:center; gap:6px; font-size:10px; color:var(--muted); text-transform:none; letter-spacing:0; }
  .scan-dot { width:7px; height:7px; border-radius:50%; background:var(--accent2); box-shadow:0 0 6px var(--accent2); animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .input-row { display:flex; gap:8px; position: relative; }

  .barcode-input {
    flex:1;
    background:var(--surface2);
    border:1.5px solid var(--accent);
    border-radius:10px;
    padding:14px 13px;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    outline:none;
    caret-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.08);
  }

  .input-hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-add { background:var(--accent2); border:none; border-radius:10px; color:var(--bg); font-weight:700; font-size:22px; width:46px; cursor:pointer; transition:all .15s; }
  .btn-add:active { transform:scale(.9); }

  /* ── 마지막 인식 ── */
  .last-bar { margin: 12px 0 0; padding: 9px 13px; background: rgba(0,255,157,.07); border: 1px solid rgba(0,255,157,.22); border-radius: 9px; display:none; align-items:center; gap:8px; }
  .last-bar.on { display:flex; }
  .last-lbl { font-size:10px; font-weight:700; letter-spacing:1px; color:var(--accent2); white-space:nowrap; text-transform:uppercase; }
  .last-code { flex:1; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text); word-break:break-all; }

  /* ── 토스트 ── */
  .toast { position:fixed; top:74px; left:50%; transform:translateX(-50%) translateY(-14px); background:var(--accent2); color:var(--bg); font-weight:700; font-size:13px; padding:9px 18px; border-radius:24px; opacity:0; transition:all .25s; z-index:999; white-space:nowrap; pointer-events:none; max-width:90vw; overflow:hidden; text-overflow:ellipsis; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.dup  { background:var(--warn); }

  /* ── 목록 ── */
  .list-section { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:14px; }
  .list-header { padding:11px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); }
  .list-actions { display:flex; gap:6px; }
  .btn-sm { background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:1px; padding:5px 10px; cursor:pointer; transition:all .15s; }
  .btn-sm:active { transform:scale(.94); color:var(--warn); }
  .search-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:9px 13px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:13px; outline:none; margin-bottom:4px; transition:border-color .2s; }
  .search-input:focus { border-color:var(--accent); }
  .search-input::placeholder { color:var(--muted); }
  .empty-st { padding:34px 20px; text-align:center; color:var(--muted); font-size:13px; line-height:2; }
  .empty-ic { font-size:32px; opacity:.22; margin-bottom:8px; }
  .bc-list { padding:7px; }
  .bc-item { display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:10px 12px; margin-bottom:5px; animation:slideIn .2s ease; transition:border-color .3s; }
  .bc-item.new { border-color:var(--accent2); }
  @keyframes slideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
  .i-num { font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); min-width:26px; text-align:right; }
  .i-info { flex:1; min-width:0; }
  .i-code { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text); word-break:break-all; line-height:1.3; }
  .i-meta { font-size:10px; color:var(--muted); margin-top:2px; }
  .btn-del { background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer; padding:5px; border-radius:6px; line-height:1; flex-shrink:0; }
  .btn-del:active { color:var(--warn); }

  /* ── 관리 메뉴 ── */
  .menu-section { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px; margin-bottom:28px; }
  .menu-btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .btn-menu {
    display:flex; flex-direction: column; align-items:center; justify-content:center; gap:6px;
    padding:16px 6px; background:var(--surface2); border:1px solid var(--border); border-radius:12px;
    color:var(--text); font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:700;
    cursor:pointer; transition:all .15s;
  }
  .btn-menu:active { transform:scale(.95); border-color:var(--accent); }
  .btn-menu .ic { font-size: 22px; }
  .btn-menu.in:active { border-color: var(--accent2); }
  .btn-menu.out:active { border-color: var(--warn); }
  .btn-menu.stock:active { border-color: var(--accent); }

  /* ── 모달 팝업 ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(3px);
  }
  .modal-backdrop.show { display: flex; }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 24px 20px;
    width: 80%;
    max-width: 300px;
    text-align: center;
    animation: modalPop .2s ease;
  }
  @keyframes modalPop { from{opacity:0;transform:scale(.92)} to{opacity:1;transform:scale(1)} }

  .modal-icon { font-size: 38px; margin-bottom: 10px; }
  .modal-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .modal-desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }

  .modal-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s;
  }
  .modal-btn:active { transform: scale(.96); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔍</div>
    <div class="logo-text">
      <span class="logo-main">UnoVision</span>
      <span class="logo-sub">Barcode Scanner</span>
    </div>
  </div>
  <div class="count-badge" id="totalCount">0 items</div>
</header>

<div class="container">

  <!-- 바코드 입력 -->
  <div class="manual-section">
    <div class="sec-lbl">
      바코드 입력
      <span class="scan-indicator"><span class="scan-dot"></span>입력 대기중</span>
    </div>
    <div class="input-row">
      <input class="barcode-input" id="manualInput" type="text"
        inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false"
        readonly
        onkeydown="handleKey(event)">
      <button class="btn-add" onclick="addManual()">+</button>
    </div>
    <div class="input-hint">📡 외장 스캐너로 바코드를 찍으면 자동 등록됩니다</div>

    <div class="last-bar" id="lastBar">
      <span class="last-lbl">LAST</span>
      <span class="last-code" id="lastCode">—</span>
    </div>
  </div>

  <!-- 목록 -->
  <div class="list-section">
    <div class="list-header">
      <span class="sec-lbl" style="margin:0">스캔 목록</span>
      <div class="list-actions">
        <button class="btn-sm" onclick="toggleSearch()">🔍 검색</button>
        <button class="btn-sm" onclick="clearAll()">전체삭제</button>
      </div>
    </div>
    <div style="padding:7px 7px 0;display:none" id="searchWrap">
      <input class="search-input" id="searchInput" placeholder="바코드 검색..." oninput="renderList()" autocomplete="off">
    </div>
    <div id="listContainer">
      <div class="empty-st"><div class="empty-ic">📋</div>스캔된 바코드가 없습니다<br>외장 스캐너로 찍거나 직접 입력하세요</div>
    </div>
  </div>

  <!-- 관리 메뉴 -->
  <div class="menu-section">
    <div class="menu-btns">
      <button class="btn-menu in" onclick="openDevModal()"><span class="ic">📥</span>입고관리</button>
      <button class="btn-menu out" onclick="openDevModal()"><span class="ic">📤</span>출고관리</button>
      <button class="btn-menu stock" onclick="openDevModal()"><span class="ic">📊</span>재고관리</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- 개발중 모달 -->
<div class="modal-backdrop" id="devModal">
  <div class="modal-box">
    <div class="modal-icon">🚧</div>
    <div class="modal-title">개발중</div>
    <div class="modal-desc">해당 기능은 현재 준비 중입니다.<br>곧 업데이트될 예정입니다.</div>
    <button class="modal-btn" onclick="closeDevModal()">확인</button>
  </div>
</div>

<script>
// ── 데이터 ─────────────────────────────────────────────────────
let barcodes   = JSON.parse(localStorage.getItem('wh_barcodes') || '[]');
let searchOpen = false;
let inputBuffer = '';

// ── 항상 포커스 유지 (외장 스캐너용 HID 입력 캡처) ───────────────
const manualInput = () => document.getElementById('manualInput');

function focusInput() {
  const el = manualInput();
  if (document.activeElement !== el) {
    el.focus({ preventScroll: true });
  }
}

// 페이지 로드 시 포커스
window.addEventListener('load', focusInput);

// 어디를 클릭/터치해도 항상 입력창으로 포커스 복귀
document.addEventListener('mousedown', (e) => {
  if (e.target.id !== 'manualInput' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
    setTimeout(focusInput, 0);
  }
});
document.addEventListener('touchstart', (e) => {
  if (e.target.id !== 'manualInput' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
    setTimeout(focusInput, 0);
  }
});

// 포커스가 빠지면 즉시 복귀 (단, 모달 열려있을 땐 제외)
manualInput().addEventListener('blur', () => {
  if (!document.getElementById('devModal').classList.contains('show')) {
    setTimeout(focusInput, 10);
  }
});

// 주기적으로 포커스 체크 (안전망)
setInterval(() => {
  if (!document.getElementById('devModal').classList.contains('show')) {
    focusInput();
  }
}, 800);

// ── 외장 스캐너 입력 처리 ───────────────────────────────────────
// readonly 인풋이라 키보드는 안 뜨지만, 외장 스캐너(HID)는 keydown 이벤트로 들어옴
function handleKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (inputBuffer.trim()) {
      addBarcode(inputBuffer);
      inputBuffer = '';
      manualInput().value = '';
    }
    return;
  }

  // readonly 속성 때문에 value가 안 바뀌므로 버퍼에 직접 누적
  if (e.key.length === 1) {
    e.preventDefault();
    inputBuffer += e.key;
    manualInput().value = inputBuffer;
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    inputBuffer = inputBuffer.slice(0, -1);
    manualInput().value = inputBuffer;
  }
}

function addManual() {
  if (inputBuffer.trim()) {
    addBarcode(inputBuffer);
    inputBuffer = '';
    manualInput().value = '';
  }
  focusInput();
}

// ── 바코드 데이터 관리 ──────────────────────────────────────────
function save() { localStorage.setItem('wh_barcodes', JSON.stringify(barcodes)); }

function addBarcode(code) {
  const s = (code || '').trim();
  if (!s) return;

  document.getElementById('lastCode').textContent = s;
  document.getElementById('lastBar').classList.add('on');

  if (barcodes.find(b => b.code === s)) {
    showToast('⚠️ 이미 등록됨: ' + s, true);
    return;
  }

  const now  = Date.now();
  const time = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  barcodes.unshift({ code: s, time, id: now });
  save(); renderList(); updateCount();
  showToast('✓ 등록: ' + s);
  if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
}

function deleteItem(id) {
  barcodes = barcodes.filter(b => b.id !== id);
  save(); renderList(); updateCount();
}

function clearAll() {
  if (!barcodes.length) return;
  if (confirm(barcodes.length + '개 항목을 모두 삭제할까요?')) {
    barcodes = []; save(); renderList(); updateCount();
  }
  focusInput();
}

function updateCount() {
  document.getElementById('totalCount').textContent = barcodes.length + ' items';
}

function renderList() {
  const container = document.getElementById('listContainer');
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const list = q ? barcodes.filter(b => b.code.toLowerCase().includes(q)) : barcodes;

  if (!list.length) {
    container.innerHTML = `<div class="empty-st"><div class="empty-ic">📋</div>${q ? '검색 결과 없음' : '스캔된 바코드가 없습니다<br>외장 스캐너로 찍거나 직접 입력하세요'}</div>`;
    return;
  }

  const total = barcodes.length;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  container.innerHTML = '<div class="bc-list">' + list.map(b => {
    const num = total - barcodes.indexOf(b);
    const isNew = Date.now() - b.id < 4000;
    const codeHtml = q
      ? b.code.replace(new RegExp(esc(q), 'gi'), m => `<span style="color:var(--accent);background:rgba(0,212,255,.12);border-radius:3px">${m}</span>`)
      : b.code;
    return `<div class="bc-item${isNew?' new':''}">
      <span class="i-num">#${num}</span>
      <div class="i-info">
        <div class="i-code">${codeHtml}</div>
        <div class="i-meta">${b.time}</div>
      </div>
      <button class="btn-del" onclick="deleteItem(${b.id})">✕</button>
    </div>`;
  }).join('') + '</div>';
}

function toggleSearch() {
  searchOpen = !searchOpen;
  const w = document.getElementById('searchWrap');
  w.style.display = searchOpen ? 'block' : 'none';
  if (searchOpen) document.getElementById('searchInput').focus();
  else { document.getElementById('searchInput').value = ''; renderList(); focusInput(); }
}

function showToast(msg, isDup = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isDup ? ' dup' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.className = 'toast', 2200);
}

// ── 개발중 모달 ─────────────────────────────────────────────────
function openDevModal() {
  document.getElementById('devModal').classList.add('show');
}
function closeDevModal() {
  document.getElementById('devModal').classList.remove('show');
  focusInput();
}

// ── 초기화 ──────────────────────────────────────────────────────
renderList();
updateCount();
focusInput();
</script>
</body>
</html>
